<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred's Rehab Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-translate="Fred's Rehab Tracker">Fred's Rehab Tracker</h1>
        <nav>
            <a href="/" data-translate="Enter Data">Enter Data</a>
            <a href="/enter-data-tabular.html" class="editor-only" data-translate="Enter Data - Tabular">Enter Data - Tabular</a>
            <a href="/history.html" data-translate="View History">View History</a>
            <a href="/steps-graph.html" data-translate="View Steps Graph">View Steps Graph</a>
            <a href="/calendar-view.html" data-translate="Calendar View">Calendar View</a>
            <a href="/achievements.html" data-translate="Achievements">Achievements</a>
            <a href="/exercise-videos.html" data-translate="Exercise Videos">Exercise Videos</a>
            <a href="/report.html" data-translate="Progress Report">Progress Report</a>
            <a href="/data-management.html" class="editor-only" data-translate="Data Management">Data Management</a>
            <a href="/help.html" data-translate="Help">Help</a>
            <a href="#" id="logout-btn" data-translate="Logout" onclick="logout()">Logout</a>
            <button id="lang-toggle"><img src="https://flagsapi.com/FR/flat/24.png" alt="French Flag"></button>
        </nav>
    </header>
    <main>
        <form id="rehab-form">
            <h2 data-translate="Log Activity">Log Activity</h2>
            <div class="fred-photo-wrapper">
                <img src="images/fred.jpg" alt="Fred's Photo" class="fred-photo">
                <div id="club-badge" class="club-badge"></div>
            </div>
            <div>
                <label for="date" data-translate="Date:">Date:</label>
                <input type="date" id="date" name="date" min="2025-10-24" max="<%= new Date().toISOString().slice(0, 10) %>" onchange="checkDataForDate()" title="Select the date for this activity entry." data-translate="Select the date for this activity entry.">
            </div>
            <hr>
            <div>
                <label for="exercise-done" data-translate="Exercise Done:" data-translate-target="#exercise-done-label">Exercise Done:</label>
                <select id="exercise-done" name="exercise-done" title="Select 'Yes' if Fred completed his exercise, 'No' otherwise." data-translate="Select 'Yes' if Fred completed his exercise, 'No' otherwise.">
                    <option value="Yes" data-translate="Yes">Yes</option>
                    <option value="No" data-translate="No">No</option>
                </select>
            </div>
            <div>
                <label for="weights-done" data-translate="Weights Done:">Weights Done:</label>
                <select id="weights-done" name="weights-done" title="Select 'Yes' if Fred completed his weights, 'No' otherwise.">
                    <option value="Yes" data-translate="Yes">Yes</option>
                    <option value="No" data-translate="No">No</option>
                </select>
            </div>
            <button type="button" class="editor-only" onclick="addExercise()" data-translate="Save Exercise">Save Exercise</button>
            <hr>
            <div>
                <div id="fitbit-status-bar">
                    <span id="fitbit-status-text" class="status-disconnected" style="font-size: 0.85em; font-weight: bold;">Checking connection...</span>
                    <a href="/auth/fitbit" id="fitbit-connect" class="fitbit-btn editor-only" data-translate="Connect Fitbit" style="display:none;">Connect Fitbit</a>
                    <button type="button" id="fitbit-disconnect" class="fitbit-btn disconnect editor-only" onclick="disconnectFitbit()" style="display:none;" data-translate="Disconnect">Disconnect</button>
                </div>
                <label for="steps-quantity" data-translate="Steps Walked:">Steps Walked:</label>
                <div class="input-group">
                    <input type="number" id="steps-quantity" name="steps-quantity" title="Enter the total number of steps Fred walked for this day." data-translate="Enter the total number of steps Fred walked for this day.">
                    <button type="button" id="fitbit-sync" class="editor-only" onclick="syncFitbit()" data-translate="Sync from Fitbit">Sync from Fitbit</button>
                </div>
            </div>
            <div>
                <label for="comments" data-translate="Comments:">Comments:</label>
                <textarea id="comments" name="comments" rows="3" title="Add any relevant comments or observations about Fred's activity." data-translate="Add any relevant comments or observations about Fred's activity."></textarea>
            </div>
            <button type="button" class="editor-only" onclick="addSteps()" data-translate="Save Steps">Save Steps</button>
        </form>
    </main>

    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="translations.js"></script>
    <script>
        const dateInput = document.getElementById('date');
        const exerciseDoneSelect = document.getElementById('exercise-done');
        const weightsDoneSelect = document.getElementById('weights-done'); // Changed from exerciseQuantitySelect
        const stepsInput = document.getElementById('steps-quantity');
        const langToggleButton = document.getElementById('lang-toggle');

        let currentLang = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    if (element.dataset.translateTarget) {
                        document.querySelector(element.dataset.translateTarget).textContent = translations[lang][key];
                    } else if (element.tagName === 'OPTION') { // Special handling for options
                        element.textContent = translations[lang][key];
                    } else if (element.tagName === 'INPUT') { // Special handling for input titles
                        element.title = translations[lang][key];
                    } else if (element.tagName === 'BUTTON' && element.id !== 'lang-toggle') { // Special handling for buttons
                        element.textContent = translations[lang][key];
                    }
                    else if (element.tagName !== 'BUTTON' && element.tagName !== 'SELECT') { // Generic text content
                        element.textContent = translations[lang][key];
                    }
                }
            });
            currentLang = lang;
            localStorage.setItem('language', lang);
            const flag = lang === 'en' ? 'FR' : 'GB';
            langToggleButton.innerHTML = `<img src="https://flagsapi.com/${flag}/flat/24.png" alt="${flag} Flag">`;
        }

        langToggleButton.addEventListener('click', () => {
            const newLang = currentLang === 'en' ? 'fr' : 'en';
            setLanguage(newLang);
        });

        // Set date to today
        dateInput.valueAsDate = new Date();
        dateInput.max = new Date().toISOString().split('T')[0];

        // Function to check for data on a given date
        async function checkDataForDate() {
            const date = dateInput.value;

            const exerciseResponse = await fetch(`/api/exercises?date=${date}`);
            const exercises = await exerciseResponse.json();

            if (exercises.length === 0) {
                exerciseDoneSelect.value = "No";
                weightsDoneSelect.value = "No"; // Default weights to No
            } else {
                exerciseDoneSelect.value = exercises[0].done;
                weightsDoneSelect.value = exercises[0].weights_done || "No"; // Get weights_done or default to No
            }

            const stepsResponse = await fetch(`/api/steps?date=${date}`);
            const steps = await stepsResponse.json();

            if (steps.length === 0) {
                stepsInput.value = ''; // Blank if no data
            } else {
                const quantityToDisplay = steps[0].quantity;
                stepsInput.value = quantityToDisplay; // Assign raw number, not formatted string
            }
            updateClubBadge(); // Update badge on date change or initial load
        }

        // Removed event listener for exerciseDoneSelect changing exerciseQuantitySelect

        // Functions to add data will be here
        async function addExercise() {
            const done = exerciseDoneSelect.value;
            const weightsDone = weightsDoneSelect.value; // Get weightsDone value
            const date = dateInput.value;
const response = await fetch(`/api/exercises?date=${date}`);
const exercises = await response.json();

if (exercises.length > 0) {
    if (!confirm('Data for this date already exists. Do you want to overwrite it?')) {
        return;
    }
}

const postResponse = await fetch('/api/exercises', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
    },
    body: `done=${done}&weights_done=${weights_done}&date=${date}`
});
            if (postResponse.ok) {
                showToast('Exercise saved!', 'success');
                checkDataForDate();
                updateClubBadge();
            } else {
                showToast('Failed to save exercise.', 'error');
            }
        }

        function speak(message) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(message);
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Speech synthesis not supported in this browser.");
            }
        }

        async function addSteps() {
            const quantity = document.getElementById('steps-quantity').value;
            const date = dateInput.value;
            const comments = document.getElementById('comments').value;

            if (!quantity) {
                showToast('Please fill in the number of steps.', 'warning');
                return;
            }

            let currentMaxSteps = 0;
            try {
                const maxStepsResponse = await fetch(`/api/steps/max?exclude_dates=${date}`);
                if (maxStepsResponse.ok) {
                    const maxStepsData = await maxStepsResponse.json();
                    currentMaxSteps = maxStepsData.max_steps || 0;
                } else {
                    console.error("Failed to fetch max steps.");
                }
            } catch (error) {
                console.error("Error fetching max steps:", error);
            }

            const response = await fetch(`/api/steps?date=${date}`);
            const steps = await response.json();

            if (steps.length > 0) {
                if (!confirm('Data for this date already exists. Do you want to overwrite it?')) {
                    return;
                }
            }

            const postResponse = await fetch('/api/steps', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `quantity=${quantity}&date=${date}&comments=${comments}`
            });
            if (postResponse.ok) {
                if (parseInt(quantity, 10) > currentMaxSteps) {
                    speak("Congratulations, that is more steps than you have ever done before.");
                }
                showToast('Steps saved!', 'success');
                checkDataForDate();
                document.getElementById('steps-quantity').value = '';
                document.getElementById('comments').value = '';
                updateClubBadge();
            } else {
                showToast('Failed to save steps.', 'error');
            }
        }

        async function checkFitbitStatus() {
            try {
                const statusResponse = await fetch('/api/fitbit/status');
                const { connected } = await statusResponse.json();
                
                const fitbitBtn = document.getElementById('fitbit-connect');
                const disconnectBtn = document.getElementById('fitbit-disconnect');
                const syncBtn = document.getElementById('fitbit-sync');
                const statusText = document.getElementById('fitbit-status-text');

                if (connected) {
                    statusText.textContent = "Fitbit is Connected";
                    statusText.className = "status-connected";
                    if (window.userRole === 'editor') {
                        fitbitBtn.style.display = 'none';
                        disconnectBtn.style.display = 'inline-block';
                        syncBtn.style.display = 'inline-block';
                    }
                } else {
                    statusText.textContent = "Fitbit not connected";
                    statusText.className = "status-disconnected";
                    if (window.userRole === 'editor') {
                        fitbitBtn.style.display = 'inline-block';
                        disconnectBtn.style.display = 'none';
                        syncBtn.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error("Error checking Fitbit status:", err);
            }
        }

        async function disconnectFitbit() {
            if (!confirm("Are you sure you want to disconnect Fred's Fitbit?")) return;
            
            try {
                const response = await fetch('/api/fitbit/disconnect', { method: 'POST' });
                if (response.ok) {
                    showToast('Disconnected from Fitbit.', 'success');
                    checkFitbitStatus();
                } else {
                    showToast('Failed to disconnect.', 'error');
                }
            } catch (err) {
                console.error("Disconnect Error:", err);
                showToast('An error occurred during disconnection.', 'error');
            }
        }

        async function syncFitbit() {
            const date = dateInput.value;
            const syncBtn = document.getElementById('fitbit-sync');
            const stepsInput = document.getElementById('steps-quantity');
            
            syncBtn.disabled = true;
            syncBtn.textContent = "Syncing...";

            try {
                const response = await fetch('/api/fitbit/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Update the field first so Fred sees the result immediately
                    stepsInput.value = data.steps;
                    
                    // Add auto-comment
                    const commentsInput = document.getElementById('comments');
                    const autoComment = "Auto-sourced from Fitbit";
                    if (!commentsInput.value.includes(autoComment)) {
                        commentsInput.value = commentsInput.value ? commentsInput.value + "\n" + autoComment : autoComment;
                    }
                    
                    // Add a brief highlight effect to the input
                    stepsInput.style.backgroundColor = '#e8f5e9'; // Light green
                    setTimeout(() => {
                        stepsInput.style.backgroundColor = ''; // Back to normal
                    }, 1000);

                    showToast(`Synced ${data.steps.toLocaleString()} steps from Fitbit.`, 'success');
                } else if (response.status === 401) {
                    showToast('Fitbit session expired. Please reconnect.', 'warning');
                    checkFitbitStatus();
                } else {
                    showToast("Failed to sync from Fitbit. Make sure the watch is synced to the phone.", 'error');
                }
            } catch (err) {
                console.error("Sync Error:", err);
                showToast('An error occurred during sync.', 'error');
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = "Sync from Fitbit";
            }
        }

        async function updateClubBadge() {
            try {
                const response = await fetch('/api/steps/club-status');
                const data = await response.json();
                const badge = document.getElementById('club-badge');
                
                if (data.level && data.level !== 'None') {
                    badge.style.display = 'flex';
                    badge.className = 'club-badge ' + 'badge-' + data.level.toLowerCase();
                    if (data.level === 'Member') {
                        badge.innerHTML = '10K<br>CLUB';
                    } else {
                        badge.innerHTML = `${data.level}<br>10K CLUB`;
                    }
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {
                console.error("Error fetching club status:", err);
            }
        }

        window.onload = async () => {
            await window.authReady;

            // Priority 1: Fitbit status
            try {
                await checkFitbitStatus();
            } catch (err) {
                console.error("Fitbit status check failed:", err);
                document.getElementById('fitbit-status-text').textContent = "Status Check Failed";
            }

            // Priority 2: Other data and language
            checkDataForDate();
            setLanguage(currentLang);
            updateClubBadge();
        };

        </script>
        </body>
        </html>
