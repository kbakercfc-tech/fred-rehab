<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred's Rehab - Tabular Data Entry</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #date-selection {
            display: flex;
            gap: 1em;
            margin-bottom: 1.5em;
            align-items: center;
            justify-content: center;
        }
        #date-selection label {
            margin-bottom: 0; /* Override default label margin */
        }
        #date-selection input {
            width: auto; /* Allow input to size naturally */
            padding: 0.8em;
            font-size: 1em;
        }
        #generate-table-btn {
            padding: 0.8em 1.5em;
        }
        #data-entry-table-container {
            margin-top: 0;
            overflow-x: auto; /* Allow horizontal scrolling for table */
        }
        #data-entry-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
        }
        #data-entry-table th, #data-entry-table td {
            border: 1px solid #ddd;
            padding: 0.8em;
            text-align: left;
            white-space: nowrap; /* Prevent wrapping in cells */
        }
        #data-entry-table th {
            background-color: #f5f5f5;
            font-weight: bold;
            color: #555;
        }
        #data-entry-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        #data-entry-table tr:hover {
            background-color: #eef;
        }
        #data-entry-table input[type="number"],
        #data-entry-table select,
        #data-entry-table textarea {
            width: 100%;
            padding: 0.5em;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9em;
        }
        #data-entry-table textarea {
            resize: vertical; /* Allow vertical resizing */
            min-height: 40px;
        }
        #save-all-btn {
            display: block;
            margin: 1.5em auto;
            padding: 1em 2em;
            font-size: 1.1em;
        }

        /* Fitbit Styles */
        .fitbit-btn {
            background-color: #00B0B9;
            color: white;
            border: none;
            padding: 0.6em 1.2em;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 0.85em;
            transition: background-color 0.3s ease;
        }
        .fitbit-btn:hover { background-color: #008a91; }
        .fitbit-btn.disconnect { background-color: #f44336; }
        .fitbit-btn.disconnect:hover { background-color: #d32f2f; }
        
        #fitbit-status-text {
            font-size: 0.8em;
            padding: 0.4em 0.8em;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-connected { background-color: #d4edda; color: #155724; }
        .status-disconnected { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>
    <header>
        <h1 data-translate="Fred's Rehab - Tabular Data Entry">Fred's Rehab - Tabular Data Entry</h1>
        <nav>
            <a href="/" data-translate="Enter Data">Enter Data</a>
            <a href="/enter-data-tabular.html" data-translate="Enter Data - Tabular">Enter Data - Tabular</a>
            <a href="/history.html" data-translate="View History">View History</a>
            <a href="/steps-graph.html" data-translate="View Steps Graph">View Steps Graph</a>
            <a href="/calendar-view.html" data-translate="Calendar View">Calendar View</a>
            <a href="/exercise-videos.html" data-translate="Exercise Videos">Exercise Videos</a>
            <a href="/data-management.html" data-translate="Data Management">Data Management</a>
            <a href="/help.html" data-translate="Help">Help</a>
            <button id="lang-toggle"><img src="https://flagsapi.com/FR/flat/24.png" alt="French Flag"></button>
        </nav>
    </header>
    <main>
        <div class="tabular-title-container">
            <h2 data-translate="Tabular Activity Entry">Tabular Activity Entry</h2>
        </div>

        <div id="date-selection">
            <div>
                <label for="start-date" data-translate="Start Date:">Start Date:</label>
                <input type="date" id="start-date" title="Select the start date for the data entry table.">
            </div>
            <div>
                <label for="end-date" data-translate="End Date:">End Date:</label>
                <input type="date" id="end-date" title="Select the end date for the data entry table.">
            </div>
            <button id="generate-table-btn" onclick="generateTable()" data-translate="Generate Table">Generate Table</button>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 20px; width: 100%; margin-top: 1em;">
            <div id="data-entry-table-container" style="flex: 1;">
                <!-- Dynamic table will be generated here -->
            </div>
            
            <div id="fitbit-tabular-section" style="background-color: #f8f9fa; padding: 1em; border-radius: 8px; border: 1px solid #dee2e6; width: 200px; margin-top: 52px; flex-shrink: 0;">
                <div style="text-align: center; margin-bottom: 0.8em;">
                    <span id="fitbit-status-text" class="status-disconnected" style="display: block;">Checking connection...</span>
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                        <a href="/auth/fitbit?from=/enter-data-tabular.html" id="fitbit-connect" class="fitbit-btn" data-translate="Connect" style="display:none; padding: 0.5em;">Connect</a>
                        <button type="button" id="fitbit-disconnect" class="fitbit-btn disconnect" onclick="disconnectFitbit()" style="display:none; padding: 0.5em;" data-translate="Disconnect">Disconnect</button>
                    </div>
                </div>
                <div style="text-align: center; border-top: 1px solid #eee; padding-top: 0.8em;">
                    <button type="button" id="fitbit-sync-all" class="fitbit-btn" onclick="syncAllFitbit()" style="display:none; width: 100%; padding: 0.6em; font-size: 0.8em;" data-translate="Sync All from Fitbit">Sync All from Fitbit</button>
                </div>
            </div>
        </div>

        <button id="save-all-btn" onclick="saveAllData()" style="display: none;" title="Save all entered data for the entire table." data-translate="Save All Data">Save All Data</button>

    </main>

    <script src="translations.js"></script>
    <script>
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const generateTableBtn = document.getElementById('generate-table-btn');
        const saveAllBtn = document.getElementById('save-all-btn');
        const dataEntryTableContainer = document.getElementById('data-entry-table-container');
        const langToggleButton = document.getElementById('lang-toggle');

        let currentLang = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    if (element.dataset.translateTarget) {
                        document.querySelector(element.dataset.translateTarget).textContent = translations[lang][key];
                    } else if (element.tagName === 'OPTION') { // Special handling for options
                        element.textContent = translations[lang][key];
                    } else if (element.tagName === 'INPUT') { // Special handling for input titles
                        element.title = translations[lang][key];
                    } else if (element.tagName === 'BUTTON' && element.id !== 'lang-toggle') { // Special handling for buttons
                        element.textContent = translations[lang][key];
                    }
                    else if (element.tagName !== 'BUTTON' && element.tagName !== 'SELECT') { // Generic text content
                        element.textContent = translations[lang][key];
                    }
                }
            });
            currentLang = lang;
            localStorage.setItem('language', lang);
            if (langToggleButton) {
                const flag = lang === 'en' ? 'FR' : 'GB';
                langToggleButton.innerHTML = `<img src="https://flagsapi.com/${flag}/flat/24.png" alt="${flag} Flag">`;
            }
        }

        if (langToggleButton) {
            langToggleButton.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'fr' : 'en';
                setLanguage(newLang);
            });
        }

        // Set default dates
        const today = new Date();
        const thirtyDaysAgo = new Date();
        thirtyDaysAgo.setDate(today.getDate() - 29); // 30 days including today

        startDateInput.valueAsDate = thirtyDaysAgo;
        endDateInput.valueAsDate = today;

        // Max date for date pickers
        startDateInput.max = today.toISOString().split('T')[0];
        endDateInput.max = today.toISOString().split('T')[0];

        async function generateTable() {
            const startDate = new Date(startDateInput.value);
            const endDate = new Date(endDateInput.value);

            if (isNaN(startDate) || isNaN(endDate) || startDate > endDate) {
                alert('Please select valid start and end dates.');
                return;
            }

            const diffTime = Math.abs(endDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

            if (diffDays > 30) {
                alert('Date range cannot exceed 30 days.');
                return;
            }

            dataEntryTableContainer.innerHTML = '';
            saveAllBtn.style.display = 'none';

            const table = document.createElement('table');
            table.id = 'data-entry-table';
            const thead = table.createTHead();
            const tbody = table.createTBody();

            const headerRow = thead.insertRow();
            headerRow.innerHTML = `
                <th data-translate="Date">Date</th>
                <th data-translate="Exercise Done">Exercise Done</th>
                <th data-translate="Weights Done">Weights Done</th>
                <th data-translate="Steps">Steps</th>
                <th data-translate="Comments">Comments</th>
            `;

            let currentDate = new Date(startDate);
            const datesToFetch = [];
            while (currentDate <= endDate) {
                datesToFetch.push(currentDate.toISOString().slice(0, 10));
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Fetch existing data for the range
            const allExercisesResponse = await fetch('/api/exercises');
            const allExercises = await allExercisesResponse.json();
            const allStepsResponse = await fetch('/api/steps');
            const allSteps = await allStepsResponse.json();

            const dataByDate = {};
            allExercises.forEach(ex => {
                dataByDate[ex.date] = dataByDate[ex.date] || {};
                dataByDate[ex.date].exercise = ex;
            });
            allSteps.forEach(step => {
                dataByDate[step.date] = dataByDate[step.date] || {};
                dataByDate[step.date].steps = step;
            });


            datesToFetch.forEach(dateString => {
                const row = tbody.insertRow();
                const existingData = dataByDate[dateString] || {};
                const exercise = existingData.exercise || {};
                const steps = existingData.steps || {};

                const exercisesDone = exercise.done || 'No';
                const weightsDone = exercise.weights_done || 'No'; // Get weights_done

                const stepsCount = steps.quantity || '';
                const comments = steps.comments || '';

                row.innerHTML = `
                    <td>${dateString}</td>
                    <td>
                        <select class="exercise-done" data-date="${dateString}" title="Select 'Yes' if Fred completed his exercise, 'No' otherwise." data-translate="Select 'Yes' if Fred completed his exercise, 'No' otherwise.">
                            <option value="Yes" ${exercisesDone === 'Yes' ? 'selected' : ''} data-translate="Yes">Yes</option>
                            <option value="No" ${exercisesDone === 'No' ? 'selected' : ''} data-translate="No">No</option>
                        </select>
                    </td>
                    <td>
                        <select class="weights-done-select" data-date="${dateString}" title="Select 'Yes' if Fred completed his weights, 'No' otherwise.">
                            <option value="Yes" ${weightsDone === 'Yes' ? 'selected' : ''} data-translate="Yes">Yes</option>
                            <option value="No" ${weightsDone === 'No' ? 'selected' : ''} data-translate="No">No</option>
                        </select>
                    </td>
                    <td><input type="text" class="steps-count" value="${stepsCount}" data-date="${dateString}" title="Enter the total number of steps Fred walked for this day." data-translate="Enter the total number of steps Fred walked for this day."></td>
                    <td><textarea class="comments" data-date="${dateString}" rows="1" title="Add any relevant comments or observations about Fred's activity." data-translate="Add any relevant comments or observations about Fred's activity."></textarea></td>
                `;

                // No event listener needed for weightsDoneSelect
            });

            table.appendChild(tbody);
            dataEntryTableContainer.appendChild(table);
            saveAllBtn.style.display = 'block';
            setLanguage(currentLang);
        }

        function speak(message) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(message);
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Speech synthesis not supported in this browser.");
            }
        }

        async function saveAllData() {
            const tableRows = document.querySelectorAll('#data-entry-table tbody tr');
            const allDataToSave = [];
            let newMaxStepsInBatch = 0;
            let newMaxStepsDate = null;

            tableRows.forEach(row => {
                const date = row.querySelector('.exercise-done').dataset.date;
                const exerciseDone = row.querySelector('.exercise-done').value;
                const weightsDone = row.querySelector('.weights-done-select').value;
                const stepsCount = row.querySelector('.steps-count').value;
                const comments = row.querySelector('.comments').value;
                
                const steps = parseInt(stepsCount) || 0;
                if (steps > newMaxStepsInBatch) {
                    newMaxStepsInBatch = steps;
                    newMaxStepsDate = date;
                }

                allDataToSave.push({
                    date,
                    exerciseDone,
                    weightsDone,
                    stepsCount: steps,
                    comments
                });
            });
            
            let currentMaxSteps = 0;
            try {
                const datesToExclude = allDataToSave.map(d => d.date);
                const maxStepsResponse = await fetch(`/api/steps/max?exclude_dates=${datesToExclude.join(',')}`);
                if (maxStepsResponse.ok) {
                    const maxStepsData = await maxStepsResponse.json();
                    currentMaxSteps = maxStepsData.max_steps || 0;
                } else {
                    console.error("Failed to fetch max steps.");
                }
            } catch (error) {
                console.error("Error fetching max steps:", error);
            }

            console.log("Data to save:", allDataToSave);

            const response = await fetch('/api/batch-save-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(allDataToSave)
            });

            if (response.ok) {
                if (newMaxStepsInBatch > currentMaxSteps) {
                    speak(`Congratulations you did more steps on date ${newMaxStepsDate} than ever before`);
                }
                alert('All data saved successfully!');
                generateTable(); // Refresh the table to show updated data
            } else {
                alert('Failed to save all data. Check console for errors.');
                console.error("Batch save failed:", await response.text());
            }
        }

        // Initial table generation on load
        window.onload = async () => { 
            // Priority 1: Fitbit
            try { await checkFitbitStatus(); } catch(e) { console.error(e); }

            generateTable();
            setLanguage(currentLang);
        };

        async function checkFitbitStatus() {
            try {
                const response = await fetch('/api/fitbit/status');
                const { connected } = await response.json();
                const fitbitBtn = document.getElementById('fitbit-connect');
                const disconnectBtn = document.getElementById('fitbit-disconnect');
                const syncAllBtn = document.getElementById('fitbit-sync-all');
                const statusText = document.getElementById('fitbit-status-text');

                if (connected) {
                    statusText.textContent = "Fitbit is connected";
                    statusText.className = "status-connected";
                    fitbitBtn.style.display = 'none';
                    disconnectBtn.style.display = 'inline-block';
                    syncAllBtn.style.display = 'block';
                } else {
                    statusText.textContent = "Fitbit not connected";
                    statusText.className = "status-disconnected";
                    fitbitBtn.style.display = 'inline-block';
                    disconnectBtn.style.display = 'none';
                    syncAllBtn.style.display = 'none';
                }
            } catch (err) {
                console.error("Fitbit status check failed:", err);
            }
        }

        async function disconnectFitbit() {
            if (!confirm("Are you sure you want to disconnect Fred's Fitbit?")) return;
            try {
                const response = await fetch('/api/fitbit/disconnect', { method: 'POST' });
                if (response.ok) {
                    alert("Disconnected from Fitbit.");
                    checkFitbitStatus();
                }
            } catch (err) { alert("Failed to disconnect."); }
        }

        async function syncAllFitbit() {
            const syncBtn = document.getElementById('fitbit-sync-all');
            const rows = document.querySelectorAll('#data-entry-table tbody tr');

            if (rows.length === 0) {
                alert("Please generate a table first.");
                return;
            }

            syncBtn.disabled = true;
            syncBtn.textContent = "Syncing All...";

            let successCount = 0;
            for (const row of rows) {
                const date = row.cells[0].textContent;
                const stepsInput = row.querySelector('.steps-count');

                try {
                    const response = await fetch('/api/fitbit/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ date })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        stepsInput.value = data.steps;
                        stepsInput.style.backgroundColor = '#e8f5e9';
                        
                        // Add auto-comment
                        const commentsArea = row.querySelector('.comments');
                        const autoComment = "Auto-sourced from Fitbit";
                        if (!commentsArea.value.includes(autoComment)) {
                            commentsArea.value = commentsArea.value ? commentsArea.value + "\n" + autoComment : autoComment;
                        }
                        
                        successCount++;
                    }
                } catch (err) {
                    console.error(`Sync failed for ${date}:`, err);
                }
            }

            syncBtn.disabled = false;
            syncBtn.textContent = "Sync All from Fitbit";
            alert(`Synced steps for ${successCount} out of ${rows.length} days.`);
        }
        </script>
        </body>
        </html>
