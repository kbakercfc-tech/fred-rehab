<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred's Exercise Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-translate="Fred's Exercise Videos">Fred's Exercise Videos</h1>
        <nav id="main-nav"></nav>
            <script src="/nav.js"></script>
    </header>
    <main>
        <div class="editor-only">
        <h2 data-translate="Upload New Exercise Video">Upload New Exercise Video</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <div>
                <label for="video-title" data-translate="Video Title:">Video Title:</label>
                <input type="text" id="video-title" name="title" title="Enter a descriptive title for the video." data-translate="Enter a descriptive title for the video.">
            </div>
            <div>
                <label for="video-file" data-translate="Select Video File:">Select Video File:</label>
                <input type="file" id="video-file" name="video" accept="video/*" title="Choose a video file from your computer to upload." data-translate="Choose a video file from your computer to upload.">
            </div>
            <button type="submit" title="Click to upload the video to the server." data-translate="Upload Video">Upload Video</button>
        </form>

        <hr>
        </div>

        <h2 data-translate="Uploaded Videos">Uploaded Videos</h2>
        <div id="video-list">
            <!-- Videos will be loaded here -->
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="translations.js"></script>
    <script>
        const langToggleButton = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    if (element.tagName === 'BUTTON' && element.id !== 'lang-toggle') {
                        element.textContent = translations[lang][key];
                    } else if (element.tagName === 'INPUT') {
                        element.title = translations[lang][key];
                    }
                    else if (element.tagName !== 'BUTTON') {
                        element.innerHTML = translations[lang][key];
                    }
                }
            });
            currentLang = lang;
            localStorage.setItem('language', lang);
            if(langToggleButton) {
                const flag = lang === 'en' ? 'FR' : 'GB';
                langToggleButton.innerHTML = `<img src="https://flagsapi.com/${flag}/flat/24.png" alt="${flag} Flag">`;
            }
        }

        if(langToggleButton) {
            langToggleButton.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'fr' : 'en';
                setLanguage(newLang);
            });
        }


        document.getElementById('upload-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const title = document.getElementById('video-title').value.trim();
            const fileInput = document.getElementById('video-file');
            if (!title) {
                showToast('Please enter a video title.', 'warning');
                return;
            }
            if (!fileInput.files.length) {
                showToast('Please select a video file.', 'warning');
                return;
            }
            const formData = new FormData(event.target);

            const response = await fetch('/upload-video', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                showToast('Video uploaded successfully!', 'success');
                event.target.reset();
                loadVideos();
            } else {
                showToast('Error uploading video.', 'error');
            }
        });

        async function loadVideos() {
            const videoList = document.getElementById('video-list');
            videoList.innerHTML = ''; // Clear existing videos

            const response = await fetch('/api/videos');
            const videos = await response.json();

            if (videos.length === 0) {
                videoList.innerHTML = '<p data-translate="No videos uploaded yet.">No videos uploaded yet.</p>';
                setLanguage(currentLang);
                return;
            }

            videos.forEach(video => {
                const videoContainer = document.createElement('div');
                videoContainer.classList.add('video-item');
                videoContainer.innerHTML = `
                    <video controls src="${video.filepath}" preload="metadata"></video>
                    <div class="video-item-footer">
                        <p class="video-item-title" title="${video.title}">${video.title}</p>
                        ${window.userRole === 'editor' ? `<button class="delete-video-btn" data-id="${video.id}">Delete</button>` : ''}
                    </div>
                `;
                videoList.appendChild(videoContainer);
            });

            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-video-btn').forEach(button => {
                button.addEventListener('click', async (event) => {
                    const videoId = event.target.dataset.id;
                    if (confirm('Are you sure you want to delete this video?')) {
                        const response = await fetch(`/api/videos/${videoId}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            showToast('Video deleted.', 'success');
                            loadVideos();
                        } else {
                            showToast('Failed to delete video.', 'error');
                        }
                    }
                });
            });
            setLanguage(currentLang);
        }

        // Receive files shared from WhatsApp (or any app) via Web Share Target
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type !== 'share-target' || !event.data.files?.length) return;
                const files = event.data.files;
                const videos = files.filter(f => f.type.startsWith('video/'));
                const photos = files.filter(f => f.type.startsWith('image/'));

                if (videos.length) {
                    // Pre-load video(s) into the file input
                    const dt = new DataTransfer();
                    videos.forEach(f => dt.items.add(f));
                    document.getElementById('video-file').files = dt.files;
                    showToast(`Video ready to upload — just add a title!`, 'success', 6000);
                    document.getElementById('video-title').focus();
                    document.getElementById('upload-form').scrollIntoView({ behavior: 'smooth' });
                }

                if (photos.length) {
                    showToast(`${photos.length} photo(s) shared — to add to Achievements, go to the Achievements page.`, 'info', 7000);
                }
            });
        }

        window.onload = async () => {
            await window.authReady;
            loadVideos();
            setLanguage(currentLang);
        };
    </script>
</body>
</html>
