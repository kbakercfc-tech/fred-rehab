<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="Fred's Achievements">Fred's Achievements</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #panel-personal { width: 100%; }

        /* ── Add Achievement collapsible ── */
        .add-ach-toggle {
            background: none;
            border: 1px dashed #aac;
            color: var(--primary, #1e3a5f);
            border-radius: 7px;
            padding: 0.45em 1.1em;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1em;
            transition: background 0.15s;
        }
        .add-ach-toggle:hover { background: #eef2f7; box-shadow: none; transform: none; }

        .add-achievement-section {
            display: none;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 1.1em 1.3em;
            margin-bottom: 1.2em;
            max-width: 520px;
        }
        .add-achievement-section.open { display: block; }
        .add-achievement-section .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.55em;
        }
        .add-achievement-section label {
            font-size: 0.83em;
            font-weight: 500;
            color: #444;
        }
        .add-achievement-section input[type="text"],
        .add-achievement-section textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.45em 0.65em;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.93em;
        }
        .add-achievement-section textarea { resize: vertical; }
        .add-achievement-section .btn-row { margin-top: 0.6em; }

        /* ── Achievement Cards ── */
        .achievements-grid {
            display: flex;
            flex-direction: column;
            gap: 1em;
            width: 100%;
        }

        .ach-card {
            border: 1px solid #dde3ea;
            border-left: 4px solid var(--accent, #3182ce);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            background: #fff;
        }
        .ach-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.8em;
            padding: 0.9em 1.1em 0.85em;
            background: #f7f9fd;
            border-bottom: 2px solid #dde3ea;
        }
        .ach-card-header-text { flex: 1; min-width: 0; }
        .ach-card-title {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--primary, #1e3a5f);
            margin: 0 0 0.2em 0;
        }
        .ach-card-desc {
            font-size: 0.875em;
            color: #555;
            margin: 0;
            font-style: italic;
        }
        .ach-card-header-actions {
            display: flex;
            gap: 0.3em;
            flex-shrink: 0;
            align-items: center;
        }

        /* Buttons */
        .btn-sm {
            padding: 0.28em 0.65em;
            font-size: 0.8em;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .btn-sm:hover { opacity: 0.8; box-shadow: none; transform: none; }
        .btn-icon {
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
            line-height: 1;
        }
        .btn-icon:hover { opacity: 0.8; box-shadow: none; transform: none; }
        .btn-edit    { background: var(--primary, #1e3a5f); color: #fff; }
        .btn-danger  { background: #dc3545; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-muted   { background: #6c757d; color: #fff; }
        .btn-outline { background: #fff; color: var(--primary, #1e3a5f); border: 1px solid var(--primary, #1e3a5f); }

        .ach-card-body { padding: 0; }

        .ach-updates-list { display: block; }

        /* ── Update table ── */
        .ach-updates-table {
            width: 100%;
            border-collapse: collapse;
        }
        .ach-updates-table thead tr {
            background: #f3f6fa;
            border-bottom: 2px solid #d0dcea;
        }
        .ach-updates-table thead th {
            padding: 0.42em 0.9em;
            text-align: left;
            font-size: 0.74em;
            font-weight: 700;
            color: #6a7a8a;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        .ach-updates-table th.col-date    { width: 115px; }
        .ach-updates-table th.col-media   { width: 170px; }
        .ach-updates-table th.col-actions { width: 68px; text-align: right; }
        .ach-updates-table tbody td {
            padding: 0.65em 0.9em;
            vertical-align: top;
            border-bottom: 1px solid #f0f2f5;
        }
        .ach-updates-table tbody:last-child tr.ach-update-entry td { border-bottom: none; }
        .ach-updates-table tbody.row-even tr.ach-update-entry { background: #fafbfc; }
        .ach-updates-table td.col-date {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--primary, #1e3a5f);
            white-space: nowrap;
        }
        .ach-updates-table td.col-notes {
            font-size: 0.88em;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .ach-updates-table td.col-actions { text-align: right; }
        .ach-update-edit-row { display: none; }
        .ach-update-edit-row.open { display: table-row; }
        .ach-update-edit-row.open .edit-update-form { display: block; }
        .ach-update-edit-row td {
            padding: 0.5em 0.9em 0.9em;
            background: #f8fafc;
            border-bottom: 1px solid #e4eaf2;
        }
        .no-notes-label, .no-media-label { color: #ccc; font-size: 0.9em; }

        /* Media thumbnails */
        .ach-update-media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .ach-media-thumb-wrap {
            position: relative;
            display: inline-block;
        }
        .ach-media-thumb {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #dee2e6;
            display: block;
        }
        .ach-media-thumb-video {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #dee2e6;
            cursor: pointer;
            display: block;
        }
        .ach-media-delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #dc3545;
            color: #fff;
            border: none;
            font-size: 0.7em;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .ach-media-delete-btn:hover { background: #a71d2a; }

        .no-updates-msg {
            color: #aaa;
            font-size: 0.85em;
            font-style: italic;
            padding: 0.7em 1.1em;
        }

        /* Card footer — minimal, no background */
        .ach-card-footer {
            padding: 0.6em 1.1em;
            border-top: 1px solid #f0f2f5;
        }

        /* Inline "Add Update" form */
        .add-update-form {
            display: none;
            background: #f8fafc;
            border: 1px solid #d0dcec;
            border-radius: 7px;
            padding: 0.85em 1em;
            margin-top: 0.6em;
        }
        .add-update-form.open { display: block; }
        .add-update-form .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6em 1em;
        }
        .add-update-form .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .add-update-form label {
            font-size: 0.82em;
            font-weight: 500;
            color: #444;
            display: block;
            margin-bottom: 0.2em;
        }
        .add-update-form input[type="date"],
        .add-update-form textarea,
        .add-update-form input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 0.45em 0.6em;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .add-update-form textarea { resize: vertical; }
        .add-update-form .form-btn-row {
            display: flex;
            gap: 0.5em;
            margin-top: 0.75em;
        }

        /* Inline edit-update form */
        .edit-update-form {
            display: none;
            background: #fff;
            border: 1px solid #c8d6e5;
            border-radius: 7px;
            padding: 0.8em 0.9em;
            margin-top: 0.6em;
        }
        .edit-update-form.open { display: block; }
        .edit-update-form .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5em 0.9em;
        }
        .edit-update-form .full-width { grid-column: 1 / -1; }
        .edit-update-form label {
            font-size: 0.82em;
            font-weight: 500;
            color: #444;
            display: block;
            margin-bottom: 0.15em;
        }
        .edit-update-form input[type="date"],
        .edit-update-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.42em 0.6em;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.88em;
        }
        .edit-update-form textarea { resize: vertical; }
        .edit-update-form .form-btn-row {
            display: flex;
            gap: 0.45em;
            margin-top: 0.6em;
        }

        /* Edit achievement modal */
        .edit-ach-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .edit-ach-modal-overlay.open { display: flex; }
        .edit-ach-modal {
            background: #fff;
            border-radius: 10px;
            padding: 1.5em 1.8em;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            position: relative;
        }
        .edit-ach-modal h3 {
            margin: 0 0 1em 0;
            color: var(--primary, #1e3a5f);
        }
        .edit-ach-modal label {
            font-size: 0.85em;
            font-weight: 500;
            color: #444;
            display: block;
            margin-bottom: 0.15em;
        }
        .edit-ach-modal input[type="text"],
        .edit-ach-modal textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5em 0.7em;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95em;
            margin-bottom: 0.7em;
        }
        .edit-ach-modal textarea { resize: vertical; }
        .edit-ach-modal .form-btn-row {
            display: flex;
            gap: 0.5em;
            margin-top: 0.5em;
        }
        .edit-ach-modal-close {
            position: absolute;
            top: 0.7em;
            right: 0.9em;
            background: none;
            border: none;
            font-size: 1.4em;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .edit-ach-modal-close:hover { color: #333; }

        .ach-loading {
            color: #aaa;
            font-size: 0.85em;
            font-style: italic;
            padding: 0.3em 0;
        }

        .panel-personal-header {
            display: flex;
            align-items: center;
            gap: 1em;
            margin-bottom: 1em;
        }
        .panel-personal-header h2 {
            margin: 0;
            flex: 1;
        }

        @media (max-width: 600px) {
            .add-update-form .form-grid,
            .edit-update-form .form-grid {
                grid-template-columns: 1fr;
            }
            .add-update-form .full-width,
            .edit-update-form .full-width {
                grid-column: 1;
            }
            .ach-card-header { flex-direction: column; gap: 0.6em; }
            .ach-card-header-actions { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1 data-translate="Fred's Achievements">Fred's Achievements</h1>
        <nav id="main-nav"></nav>
            <script src="/nav.js"></script>
    </header>

    <main>
        <!-- ══ Fred's Personal Achievements ══ -->
        <div id="panel-personal">

            <!-- Add Achievement toggle + form (editor only) -->
            <button class="editor-only add-ach-toggle" id="add-ach-toggle-btn" onclick="
                const sec = document.getElementById('add-achievement-section');
                const open = sec.classList.toggle('open');
                this.textContent = open ? '✕ Cancel' : '+ New Achievement';
            ">+ New Achievement</button>

            <section class="editor-only add-achievement-section" id="add-achievement-section">
                <form id="add-achievement-form">
                    <div class="form-row">
                        <div>
                            <label for="new-ach-name">Achievement Name</label>
                            <input type="text" id="new-ach-name" name="name" placeholder="e.g. First 5,000-step day">
                        </div>
                        <div>
                            <label for="new-ach-desc">Description (optional)</label>
                            <textarea id="new-ach-desc" name="description" rows="2" placeholder="A short description..."></textarea>
                        </div>
                        <div class="btn-row">
                            <button type="submit" class="btn-sm btn-edit" style="font-size:0.9em; padding:0.45em 1.1em;">Add Achievement</button>
                        </div>
                    </div>
                </form>
            </section>

            <div id="achievements-grid" class="achievements-grid"></div>
            <p id="no-achievements" style="display:none; color:#888; font-style:italic;" data-translate="No achievements recorded yet.">No achievements recorded yet.</p>
        </div>

    </main>

    <!-- Confirm dialog -->
    <div id="confirm-dialog" style="display:none;" class="confirm-overlay">
        <div class="confirm-box">
            <p id="confirm-message"></p>
            <div class="confirm-actions">
                <button id="confirm-yes" class="delete-achievement" style="position:static;margin-top:0;">Yes, Delete</button>
                <button id="confirm-no">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for viewing media -->
    <div id="media-modal" class="achievement-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="document.getElementById('media-modal').style.display='none'; document.getElementById('modal-body').innerHTML=''">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Edit Achievement modal -->
    <div id="edit-ach-modal-overlay" class="edit-ach-modal-overlay" onclick="closeEditAchModal(event)">
        <div class="edit-ach-modal" onclick="event.stopPropagation()">
            <button class="edit-ach-modal-close" onclick="closeEditAchModal()">&times;</button>
            <h3>Edit Achievement</h3>
            <form id="edit-ach-modal-form">
                <input type="hidden" id="edit-ach-modal-id">
                <label for="edit-ach-modal-name">Achievement Name</label>
                <input type="text" id="edit-ach-modal-name" name="name">
                <label for="edit-ach-modal-desc">Description (optional)</label>
                <textarea id="edit-ach-modal-desc" name="description" rows="3"></textarea>
                <div class="form-btn-row">
                    <button type="submit" class="btn-sm btn-success" style="font-size:0.9em; padding:0.45em 1.1em;">Save Changes</button>
                    <button type="button" class="btn-sm btn-muted" style="font-size:0.9em; padding:0.45em 1.1em;" onclick="closeEditAchModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="translations.js"></script>
    <script>
        let currentLang = localStorage.getItem('preferredLanguage') || 'en';

        // ══════════════════════════════════════════
        // ── Personal Achievements – Card UI ──
        // ══════════════════════════════════════════

        const grid           = document.getElementById('achievements-grid');
        const noAchievements = document.getElementById('no-achievements');
        const isEditor       = () => window.userRole === 'editor';

        // ── Date helpers ──
        function formatDateDDMMMYYYY(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // ── Load all achievements (cards) ──
        async function loadAchievements() {
            try {
                const res  = await fetch('/api/achievements');
                const list = await res.json();

                grid.innerHTML = '';

                if (!list.length) {
                    noAchievements.style.display = 'block';
                    return;
                }
                noAchievements.style.display = 'none';

                for (const ach of list) {
                    const card = buildAchievementCard(ach);
                    grid.appendChild(card);
                    // Lazy-load updates into the card
                    loadUpdatesIntoCard(ach.id, card);
                }
            } catch (err) {
                console.error('Error loading achievements:', err);
            }
        }

        // ── Build a card DOM element for one achievement ──
        function buildAchievementCard(ach) {
            const card = document.createElement('div');
            card.className = 'ach-card';
            card.dataset.achId = ach.id;

            const editorControls = isEditor() ? `
                <div class="ach-card-header-actions">
                    <button class="btn-icon btn-edit btn-edit-ach" title="Edit achievement">✎</button>
                    <button class="btn-icon btn-danger btn-delete-ach" title="Delete achievement">✕</button>
                </div>` : '';

            card.innerHTML = `
                <div class="ach-card-header">
                    <div class="ach-card-header-text">
                        <p class="ach-card-title">${escHtml(ach.name)}</p>
                        <p class="ach-card-desc">${escHtml(ach.description || '')}</p>
                    </div>
                    ${editorControls}
                </div>
                <div class="ach-card-body">
                    <div class="ach-updates-list" id="updates-list-${ach.id}">
                        <span class="ach-loading">Loading updates...</span>
                    </div>
                </div>
                <div class="ach-card-footer">
                    ${isEditor() ? `
                        <button class="btn-sm btn-outline btn-add-update">+ Add Update</button>
                        <div class="add-update-form" id="add-update-form-${ach.id}">
                            <form>
                                <div class="form-grid">
                                    <div>
                                        <label>Date</label>
                                        <input type="date" class="aupd-date" value="${new Date().toISOString().slice(0,10)}">
                                    </div>
                                    <div class="full-width">
                                        <label>Comments</label>
                                        <textarea class="aupd-comments" rows="2" placeholder="Describe this milestone update..."></textarea>
                                    </div>
                                    <div class="full-width">
                                        <label>Photos / Videos</label>
                                        <input type="file" class="aupd-media" accept="image/*,video/*" multiple>
                                    </div>
                                </div>
                                <div class="form-btn-row">
                                    <button type="submit" class="btn-sm btn-success">Save</button>
                                    <button type="button" class="btn-sm btn-muted btn-cancel-add-update">Cancel</button>
                                </div>
                            </form>
                        </div>
                    ` : ''}
                </div>
            `;

            // Wire up editor buttons
            if (isEditor()) {
                card.querySelector('.btn-edit-ach').addEventListener('click', () => openEditAchModal(ach));
                card.querySelector('.btn-delete-ach').addEventListener('click', () => deleteAchievement(ach.id));

                const addUpdateForm = card.querySelector('.add-update-form');
                card.querySelector('.btn-add-update').addEventListener('click', () => {
                    addUpdateForm.classList.toggle('open');
                });
                card.querySelector('.btn-cancel-add-update').addEventListener('click', () => {
                    addUpdateForm.classList.remove('open');
                    addUpdateForm.querySelector('form').reset();
                    addUpdateForm.querySelector('.aupd-date').value = new Date().toISOString().slice(0,10);
                });
                addUpdateForm.querySelector('form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await submitAddUpdate(ach.id, addUpdateForm, card);
                });
            }

            return card;
        }

        // ── Lazy-load updates into a card ──
        async function loadUpdatesIntoCard(achId, card) {
            const listEl = card.querySelector(`#updates-list-${achId}`);
            try {
                const res     = await fetch(`/api/achievement-updates/${achId}`);
                const updates = await res.json();
                renderUpdatesList(achId, updates, listEl);
            } catch (err) {
                listEl.innerHTML = '<span style="color:#c00;font-size:0.85em;">Failed to load updates.</span>';
                console.error('Error loading updates for achievement', achId, err);
            }
        }

        // ── Render the list of update entries ──
        function renderUpdatesList(achId, updates, listEl) {
            listEl.innerHTML = '';

            if (!updates.length) {
                listEl.innerHTML = '<p class="no-updates-msg">No updates yet.</p>';
                return;
            }

            // Sort chronologically (oldest first)
            updates.sort((a, b) => a.update_date.localeCompare(b.update_date));

            const table = document.createElement('table');
            table.className = 'ach-updates-table';

            const actionsHeader = isEditor() ? '<th class="col-actions"></th>' : '';
            const thead = document.createElement('thead');
            thead.innerHTML = `<tr>
                <th class="col-date">Date</th>
                <th class="col-notes">Notes</th>
                <th class="col-media">Photos / Videos</th>
                ${actionsHeader}
            </tr>`;
            table.appendChild(thead);

            updates.forEach((upd, i) => {
                const tbody = buildUpdateEntry(achId, upd);
                if (i % 2 === 1) tbody.classList.add('row-even');
                table.appendChild(tbody);
            });

            listEl.appendChild(table);
        }

        // ── Build one update entry element (returns a <tbody> with data row + edit row) ──
        function buildUpdateEntry(achId, upd) {
            const tbody = document.createElement('tbody');
            tbody.dataset.updId = upd.id;

            const colCount = isEditor() ? 4 : 3;

            // Build media cell
            const media = upd.media || [];
            let mediaHtml = '';
            if (media.length > 0) {
                let thumbs = '';
                for (const m of media) {
                    const delBtn = isEditor()
                        ? `<button class="ach-media-delete-btn" data-media-id="${m.id}" title="Remove">&times;</button>`
                        : '';
                    if (m.media_type === 'photo') {
                        thumbs += `<div class="ach-media-thumb-wrap">
                            <img src="${m.filepath}" alt="photo" class="ach-media-thumb"
                                onclick='openModal("photo","${m.filepath.replace(/'/g,"\\'")}",${m.id})'>
                            ${delBtn}
                        </div>`;
                    } else {
                        thumbs += `<div class="ach-media-thumb-wrap">
                            <video src="${m.filepath}" class="ach-media-thumb-video" preload="metadata"
                                onclick='openModal("video","${m.filepath.replace(/'/g,"\\'")}",${m.id})'></video>
                            ${delBtn}
                        </div>`;
                    }
                }
                mediaHtml = `<div class="ach-update-media-row">${thumbs}</div>`;
            } else {
                mediaHtml = '<span class="no-media-label">—</span>';
            }

            const actionsCell = isEditor() ? `
                <td class="col-actions">
                    <button class="btn-icon btn-edit btn-edit-upd" title="Edit">✎</button>
                    <button class="btn-icon btn-danger btn-delete-upd" title="Delete">✕</button>
                </td>` : '';

            // Data row
            const dataRow = document.createElement('tr');
            dataRow.className = 'ach-update-entry';
            dataRow.innerHTML = `
                <td class="col-date">${formatDateDDMMMYYYY(upd.update_date)}</td>
                <td class="col-notes">${upd.comments ? escHtml(upd.comments) : '<span class="no-notes-label">—</span>'}</td>
                <td class="col-media">${mediaHtml}</td>
                ${actionsCell}
            `;

            // Edit form row (hidden by default)
            const editRow = document.createElement('tr');
            editRow.className = 'ach-update-edit-row';
            editRow.innerHTML = isEditor() ? `
                <td colspan="${colCount}" class="edit-upd-cell">
                    <div class="edit-update-form" id="edit-upd-form-${upd.id}">
                        <div class="form-grid">
                            <div>
                                <label>Date</label>
                                <input type="date" class="eupd-date" value="${upd.update_date ? upd.update_date.slice(0,10) : ''}">
                            </div>
                            <div class="full-width">
                                <label>Comments</label>
                                <textarea class="eupd-comments" rows="2">${escHtml(upd.comments || '')}</textarea>
                            </div>
                            <div class="full-width">
                                <label>Add photos / videos</label>
                                <input type="file" class="eupd-media" accept="image/*,video/*" multiple>
                            </div>
                        </div>
                        <div class="form-btn-row">
                            <button class="btn-sm btn-success btn-save-upd" style="font-size:0.8em;padding:0.3em 0.8em;">Save</button>
                            <button class="btn-sm btn-muted btn-cancel-edit-upd" style="font-size:0.8em;padding:0.3em 0.8em;">Cancel</button>
                        </div>
                    </div>
                </td>` : '';

            tbody.appendChild(dataRow);
            tbody.appendChild(editRow);

            // Wire up edit/delete buttons
            if (isEditor()) {
                dataRow.querySelector('.btn-edit-upd').addEventListener('click', () => {
                    editRow.classList.toggle('open');
                });
                editRow.querySelector('.btn-cancel-edit-upd').addEventListener('click', () => {
                    editRow.classList.remove('open');
                });
                editRow.querySelector('.btn-save-upd').addEventListener('click', async () => {
                    await saveEditUpdate(upd.id, tbody, achId);
                });
                dataRow.querySelector('.btn-delete-upd').addEventListener('click', () => {
                    deleteUpdate(upd.id, achId);
                });

                // Per-media delete buttons
                dataRow.querySelectorAll('.ach-media-delete-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mediaId = parseInt(btn.dataset.mediaId, 10);
                        deleteMedia(mediaId, achId);
                    });
                });
            }

            return tbody;
        }

        // ── Submit: add a new update ──
        async function submitAddUpdate(achId, formWrapper, card) {
            const dateVal     = formWrapper.querySelector('.aupd-date').value;
            const commentsVal = formWrapper.querySelector('.aupd-comments').value.trim();
            const filesInput  = formWrapper.querySelector('.aupd-media');

            if (!dateVal) { showToast('Please pick a date.', 'warning'); return; }

            const fd = new FormData();
            fd.append('achievement_id', achId);
            fd.append('update_date', dateVal);
            fd.append('comments', commentsVal);
            for (const f of filesInput.files) {
                fd.append('media', f);
            }

            try {
                const res = await fetch('/api/achievement-updates', { method: 'POST', body: fd });
                if (!res.ok) { showToast('Failed to save update.', 'error'); return; }
                showToast('Update saved!', 'success');
                formWrapper.classList.remove('open');
                formWrapper.querySelector('form').reset();
                formWrapper.querySelector('.aupd-date').value = new Date().toISOString().slice(0,10);
                await loadUpdatesIntoCard(achId, card);
            } catch (err) {
                console.error('Error saving update:', err);
                showToast('Error saving update.', 'error');
            }
        }

        // ── Save an edited update ──
        async function saveEditUpdate(updId, entryEl, achId) {
            const form       = entryEl.querySelector('.edit-update-form');
            const dateVal    = form.querySelector('.eupd-date').value;
            const commentVal = form.querySelector('.eupd-comments').value.trim();
            const filesInput = form.querySelector('.eupd-media');

            if (!dateVal) { showToast('Please pick a date.', 'warning'); return; }

            try {
                // Save date + comments
                const res = await fetch(`/api/achievement-updates/${updId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ update_date: dateVal, comments: commentVal })
                });
                if (!res.ok) { showToast('Failed to save update.', 'error'); return; }

                // Upload any new media files
                if (filesInput && filesInput.files.length > 0) {
                    const fd = new FormData();
                    fd.append('update_id', updId);
                    for (const f of filesInput.files) fd.append('media', f);
                    const mediaRes = await fetch('/api/achievement-update-media', { method: 'POST', body: fd });
                    if (!mediaRes.ok) { showToast('Update saved but some files failed to upload.', 'warning'); }
                }

                showToast('Update saved!', 'success');
                form.classList.remove('open');
                const card = entryEl.closest('.ach-card');
                await loadUpdatesIntoCard(achId, card);
            } catch (err) {
                console.error('Error saving update:', err);
                showToast('Error saving update.', 'error');
            }
        }

        // ── Delete an update ──
        function deleteUpdate(updId, achId) {
            showConfirm('Delete this update? This cannot be undone.', async () => {
                try {
                    const res = await fetch(`/api/achievement-updates/${updId}`, { method: 'DELETE' });
                    if (!res.ok) { showToast('Failed to delete update.', 'error'); return; }
                    showToast('Update deleted.', 'success');
                    const card = grid.querySelector(`[data-ach-id="${achId}"]`);
                    if (card) await loadUpdatesIntoCard(achId, card);
                } catch (err) {
                    console.error('Error deleting update:', err);
                }
            });
        }

        // ── Delete a single media file ──
        function deleteMedia(mediaId, achId) {
            showConfirm('Remove this photo/video? This cannot be undone.', async () => {
                try {
                    const res = await fetch(`/api/achievement-update-media/${mediaId}`, { method: 'DELETE' });
                    if (!res.ok) { showToast('Failed to remove media.', 'error'); return; }
                    showToast('Media removed.', 'success');
                    const card = grid.querySelector(`[data-ach-id="${achId}"]`);
                    if (card) await loadUpdatesIntoCard(achId, card);
                } catch (err) {
                    console.error('Error deleting media:', err);
                }
            });
        }

        // ── Delete an entire achievement ──
        function deleteAchievement(achId) {
            showConfirm('Delete this achievement and all its updates? This cannot be undone.', async () => {
                try {
                    const res = await fetch(`/api/achievements/${achId}`, { method: 'DELETE' });
                    if (!res.ok) { showToast('Failed to delete achievement.', 'error'); return; }
                    showToast('Achievement deleted.', 'success');
                    loadAchievements();
                } catch (err) {
                    console.error('Error deleting achievement:', err);
                }
            });
        }

        // ── Add Achievement form submit ──
        document.getElementById('add-achievement-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameVal = document.getElementById('new-ach-name').value.trim();
            const descVal = document.getElementById('new-ach-desc').value.trim();
            if (!nameVal) { showToast('Please enter an achievement name.', 'warning'); return; }
            try {
                const res = await fetch('/api/achievements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nameVal, description: descVal })
                });
                if (!res.ok) { showToast('Failed to add achievement.', 'error'); return; }
                showToast('Achievement added!', 'success');
                e.target.reset();
                loadAchievements();
            } catch (err) {
                console.error('Error adding achievement:', err);
                showToast('Error adding achievement.', 'error');
            }
        });

        // ── Edit Achievement modal ──
        function openEditAchModal(ach) {
            document.getElementById('edit-ach-modal-id').value   = ach.id;
            document.getElementById('edit-ach-modal-name').value = ach.name;
            document.getElementById('edit-ach-modal-desc').value = ach.description || '';
            document.getElementById('edit-ach-modal-overlay').classList.add('open');
        }

        function closeEditAchModal(event) {
            if (event && event.target !== document.getElementById('edit-ach-modal-overlay')) return;
            document.getElementById('edit-ach-modal-overlay').classList.remove('open');
        }

        document.getElementById('edit-ach-modal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id      = document.getElementById('edit-ach-modal-id').value;
            const nameVal = document.getElementById('edit-ach-modal-name').value.trim();
            const descVal = document.getElementById('edit-ach-modal-desc').value.trim();
            if (!nameVal) { showToast('Please enter an achievement name.', 'warning'); return; }
            try {
                const res = await fetch(`/api/achievements/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nameVal, description: descVal })
                });
                if (!res.ok) { showToast('Failed to update achievement.', 'error'); return; }
                showToast('Achievement updated!', 'success');
                document.getElementById('edit-ach-modal-overlay').classList.remove('open');
                loadAchievements();
            } catch (err) {
                console.error('Error updating achievement:', err);
                showToast('Error updating achievement.', 'error');
            }
        });

        // ── Media modal ──
        function openModal(type, filepath) {
            const modal     = document.getElementById('media-modal');
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = type === 'photo'
                ? `<img src="${filepath}" alt="Achievement Photo">`
                : `<video controls autoplay style="width:100%;height:auto;max-height:85vh;" src="${filepath}"></video>`;
            modal.style.display = 'flex';
        }

        function closeModal(event) {
            const modal = document.getElementById('media-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
                document.getElementById('modal-body').innerHTML = '';
            }
        }

        // ── Confirm dialog ──
        function showConfirm(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirm-dialog').style.display = 'flex';
            document.getElementById('confirm-yes').onclick = () => {
                document.getElementById('confirm-dialog').style.display = 'none';
                onConfirm();
            };
            document.getElementById('confirm-no').onclick = () => {
                document.getElementById('confirm-dialog').style.display = 'none';
            };
        }

        // ── HTML escape helper ──
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ── Language toggle ──
        const langToggle = document.getElementById('lang-toggle');
        langToggle.onclick = () => {
            currentLang = currentLang === 'en' ? 'fr' : 'en';
            localStorage.setItem('preferredLanguage', currentLang);
            setLanguage(currentLang);
            loadAchievements();
        };

        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT' && el.type === 'date') return;
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            const flagImg = langToggle.querySelector('img');
            flagImg.src = lang === 'en' ? 'https://flagsapi.com/FR/flat/24.png' : 'https://flagsapi.com/GB/flat/24.png';
            flagImg.alt = lang === 'en' ? 'French Flag' : 'English Flag';
        }

        window.onload = async () => {
            await window.authReady;
            setLanguage(currentLang);
            loadAchievements();
        };
    </script>
</body>
</html>
