<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred's Rehab - Ask</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-translate="Fred's Rehab Tracker">Fred's Rehab Tracker</h1>
        <nav id="main-nav"></nav>
            <script src="/nav.js"></script>
    </header>
    <main class="ask-page">
        <div class="ask-heading">
            <h2 data-translate="Ask About Fred's Progress">Ask About Fred's Progress</h2>
            <button type="button" id="ask-new-chat" class="ask-new-chat" data-translate="New chat" hidden>New chat</button>
        </div>
        <p id="ask-intro" data-translate="ask_intro">Ask a question about Fred's steps, exercise, achievements and fun milestones. Answers come from the data recorded in this app.</p>

        <div id="ask-suggestions" class="ask-suggestions">
            <button type="button" class="ask-suggestion" data-translate="ask_q1">How did last month compare with the month before?</button>
            <button type="button" class="ask-suggestion" data-translate="ask_q2">What is Fred's best day for steps?</button>
            <button type="button" class="ask-suggestion" data-translate="ask_q3">How often has Fred done his exercises this year?</button>
            <button type="button" class="ask-suggestion" data-translate="ask_q4">How close is Fred to reaching Paris?</button>
        </div>

        <div id="ask-messages" class="ask-messages" aria-live="polite"></div>

        <form id="ask-form" class="ask-form">
            <textarea id="ask-input" rows="2" maxlength="1000" aria-label="Your question" placeholder="Type your question..."></textarea>
            <button type="submit" id="ask-send" data-translate="Ask">Ask</button>
        </form>
        <p class="ask-note" data-translate="ask_note">Answers are generated by AI. Please check anything important against the history pages.</p>
    </main>

    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="translations.js"></script>
    <script>
        const messagesEl = document.getElementById('ask-messages');
        const suggestionsEl = document.getElementById('ask-suggestions');
        const introEl = document.getElementById('ask-intro');
        const newChatBtn = document.getElementById('ask-new-chat');
        const form = document.getElementById('ask-form');
        const input = document.getElementById('ask-input');
        const sendBtn = document.getElementById('ask-send');
        const langToggle = document.getElementById('lang-toggle');

        let currentLang = localStorage.getItem('language') || 'en';
        let conversation = [];
        let waiting = false;

        const t = key => (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            input.placeholder = t('ask_placeholder');
            const flag = lang === 'en' ? 'FR' : 'GB';
            langToggle.innerHTML = `<img src="/images/flag-${flag.toLowerCase()}.svg" alt="${flag}">`;
        }

        langToggle.addEventListener('click', () => setLanguage(currentLang === 'en' ? 'fr' : 'en'));

        function escapeHtml(text) {
            const el = document.createElement('div');
            el.textContent = text;
            return el.innerHTML;
        }

        // Answers use only bold and "- " bullets. Text is escaped before any markup is added.
        function formatAnswer(text) {
            const inline = line => escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            let html = '';
            let inList = false;
            for (const rawLine of text.split('\n')) {
                const line = rawLine.trim();
                const isBullet = line.startsWith('- ');
                if (isBullet && !inList) { html += '<ul>'; inList = true; }
                if (!isBullet && inList) { html += '</ul>'; inList = false; }
                if (isBullet) html += `<li>${inline(line.slice(2))}</li>`;
                else if (line) html += `<p>${inline(line)}</p>`;
            }
            return inList ? html + '</ul>' : html;
        }

        function addMessage(role, html) {
            const el = document.createElement('div');
            el.className = `ask-message ask-message-${role}`;
            el.innerHTML = html;
            messagesEl.appendChild(el);
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            return el;
        }

        function setWaiting(isWaiting) {
            waiting = isWaiting;
            sendBtn.disabled = isWaiting;
            newChatBtn.disabled = isWaiting;
        }

        async function ask(question) {
            const text = question.trim();
            if (!text || waiting) return;

            suggestionsEl.hidden = true;
            introEl.hidden = true;
            newChatBtn.hidden = false;
            input.value = '';
            addMessage('user', `<p>${escapeHtml(text)}</p>`);
            conversation.push({ role: 'user', content: text });

            setWaiting(true);
            const pending = addMessage('assistant', `<p class="ask-thinking">${escapeHtml(t('ask_thinking'))}</p>`);

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversation }),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || t('ask_error'));

                pending.innerHTML = formatAnswer(data.answer);
                conversation.push({ role: 'assistant', content: data.answer });
            } catch (err) {
                // Drop the failed question so the next attempt is not sent after an unanswered turn.
                conversation.pop();
                pending.classList.add('ask-message-error');
                pending.innerHTML = `<p>${escapeHtml(err.message || t('ask_error'))}</p>`;
            } finally {
                setWaiting(false);
                input.focus();
            }
        }

        form.addEventListener('submit', event => {
            event.preventDefault();
            ask(input.value);
        });

        input.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                ask(input.value);
            }
        });

        suggestionsEl.addEventListener('click', event => {
            if (event.target.matches('.ask-suggestion')) ask(event.target.textContent);
        });

        newChatBtn.addEventListener('click', () => {
            conversation = [];
            messagesEl.innerHTML = '';
            suggestionsEl.hidden = false;
            introEl.hidden = false;
            newChatBtn.hidden = true;
            input.focus();
        });

        window.onload = async () => {
            await window.authReady;
            setLanguage(currentLang);
        };
    </script>
</body>
</html>
