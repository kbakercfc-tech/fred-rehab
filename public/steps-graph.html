<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred's Steps Graph</title>
    <script src="chart.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-translate="Fred's Steps Graph">Fred's Steps Graph</h1>
        <nav>
            <a href="/" data-translate="Enter Data">Enter Data</a>
            <a href="/enter-data-tabular.html" data-translate="Enter Data - Tabular">Enter Data - Tabular</a>
            <a href="/history.html" data-translate="View History">View History</a>
            <a href="/steps-graph.html" data-translate="View Steps Graph">View Steps Graph</a>
            <a href="/calendar-view.html" data-translate="Calendar View">Calendar View</a>
            <a href="/exercise-videos.html" data-translate="Exercise Videos">Exercise Videos</a>
            <a href="/data-management.html" data-translate="Data Management">Data Management</a>
            <a href="/help.html" data-translate="Help">Help</a>
            <button id="lang-toggle"><img src="https://flagsapi.com/FR/flat/24.png" alt="French Flag"></button>
        </nav>
    </header>
    <main>
        <div class="graph-and-summary-wrapper">
            <div class="chart-flex-container">
                <div class="chart-section">
                    <div class="filter-controls">
                        <label for="filter-type" data-translate="View:">View:</label>
                        <select id="filter-type" onchange="toggleDatePickers()" title="Select a time period to display on the graph.">
                            <option value="all" data-translate="All Entries">All Entries</option>
                            <option value="30days" data-translate="Last 30 Days">Last 30 Days</option>
                            <option value="custom" data-translate="Select Period">Select Period</option>
                        </select>
                        <label for="sort-type" data-translate="Sort by:">Sort by:</label>
                        <select id="sort-type" onchange="applyFilter()" title="Select a sorting order for the graph data.">
                            <option value="date-asc" data-translate="Date">Date</option>
                            <option value="steps-asc" data-translate="Steps">Steps</option>
                        </select>
                        <div id="custom-date-pickers" style="display: none;">
                            <label for="start-date" data-translate="From:">From:</label>
                            <input type="date" id="start-date" title="Select the start date for your custom period." data-translate="Select the start date for your custom period.">
                            <label for="end-date" data-translate="To:">To:</label>
                            <input type="date" id="end-date" title="Select the end date for your custom period." data-translate="Select the end date for your custom period.">
                        </div>
                        <button onclick="applyFilter()" title="Apply the selected date filter to the graph." data-translate="Apply Filter">Apply Filter</button>
                    </div>
                    <div class="chart-controls">
                        <button onclick="renderChart('line')" title="Display the data as a Line Chart." data-translate="Line Chart">Line Chart</button>
                        <button onclick="renderChart('bar')" title="Display the data as a Bar Chart." data-translate="Bar Chart">Bar Chart</button>
                        <button onclick="shareGraph()" title="Share a link to this steps graph page." data-translate="Share Graph">Share Graph</button>
                    </div>
                    <div id="chart-container">
                        <canvas id="stepsChart"></canvas>
                    </div>
                    <div class="legend-and-summary-wrapper">
                        <div class="legend">
                            <span class="legend-item"><span class="legend-color-box" style="background-color: darkgreen;"></span> <span data-translate="Exercises & Weights Done">Exercises & Weights Done</span></span>
                            <span class="legend-item"><span class="legend-color-box" style="background-color: #ADD8E6;"></span> <span data-translate="Only Weights done">Only Weights done</span></span>
                            <span class="legend-item"><span class="legend-color-box" style="background-color: #d4edda;"></span> <span data-translate="Only Exercises Done">Only Exercises Done</span></span>
                            <span class="legend-item"><span class="legend-color-box" style="background-color: #f1f1f1;"></span> <span data-translate="No exercise or weights done">No exercise or weights done</span></span>
                            <span class="legend-item"><span class="legend-color-box" style="border: 1px solid red;"></span> <span data-translate="Largest Steps Day">Largest Steps Day</span></span>
                        </div>
                        <div class="summary-boxes-vertical">
                            <div class="summary-box">
                                <h3 data-translate="Largest Steps">Largest Steps</h3>
                                <p id="largest-steps" class="summary-value">0</p>
                                <p id="largest-steps-date" class="summary-date"></p>
                            </div>
                            <div class="summary-box">
                                <h3 data-translate="Average Steps">Average Steps</h3>
                                <p id="average-steps" class="summary-value">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="translations.js"></script>
    <script>
        let chart;
        let chartData; // Declare chartData globally

        const filterTypeSelect = document.getElementById('filter-type');
        const customDatePickers = document.getElementById('custom-date-pickers');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const langToggleButton = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    if (element.tagName === 'OPTION') {
                        element.textContent = translations[lang][key];
                    } else if (element.tagName === 'INPUT') {
                        element.title = translations[lang][key];
                    } else if (element.tagName === 'BUTTON' && element.id !== 'lang-toggle') {
                        element.textContent = translations[lang][key];
                    }
                    else if (element.tagName !== 'BUTTON' && element.tagName !== 'SELECT') { // Exclude SELECT element
                        element.innerHTML = translations[lang][key];
                    }
                }
            });
            currentLang = lang;
            localStorage.setItem('language', lang);
            if(langToggleButton) {
                const flag = lang === 'en' ? 'FR' : 'GB';
                langToggleButton.innerHTML = `<img src="https://flagsapi.com/${flag}/flat/24.png" alt="${flag} Flag">`;
            }
            loadChartData(); // Call loadChartData after language is set
        }

        if(langToggleButton) {
            langToggleButton.addEventListener('click', () => {
                const newLang = currentLang === 'en' ? 'fr' : 'en';
                setLanguage(newLang);
            });
        }


        // Set max date for date pickers
        const todayForPicker = new Date();
        startDateInput.max = todayForPicker.toISOString().slice(0, 10);
        endDateInput.max = todayForPicker.toISOString().slice(0, 10);

        function toggleDatePickers() {
            if (filterTypeSelect.value === 'custom') {
                customDatePickers.style.display = 'block';
            } else {
                customDatePickers.style.display = 'none';
            }
        }

        async function applyFilter() {
            await loadChartData();
        }

        // Helper function to format date to DD-MMM-YY
        function formatDateDDMMMYY(dateString) {
            const date = new Date(dateString);
            const options = { day: '2-digit', month: 'short', year: '2-digit' };
            return date.toLocaleDateString('en-GB', options).replace(/ /g, '-').toUpperCase();
        }

        // renderChart function (globally accessible)
        function renderChart(type) {
            if (chart) {
                chart.destroy();
            }
            const ctx = document.getElementById('stepsChart').getContext('2d');
            if (!ctx) {
                return;
            }
            chart = new Chart(ctx, {
                type: type,
                data: chartData,
                options: {
                    scales: {
                        x: {
                            
                        },
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        async function loadChartData() {
            let stepsApiUrl = '/api/steps';
            let exercisesApiUrl = '/api/exercises';
            const filterType = filterTypeSelect.value;
            const sortType = document.getElementById('sort-type') ? document.getElementById('sort-type').value : 'date-asc';
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let actualStartDate = null;
            let actualEndDate = null;

            if (filterType === '30days') {
                actualStartDate = new Date(today);
                actualStartDate.setDate(today.getDate() - 29);
                actualEndDate = today;
            } else if (filterType === 'custom') {
                const customStart = new Date(startDateInput.value);
                const customEnd = new Date(endDateInput.value);
                if (isNaN(customStart) || isNaN(customEnd) || customStart > customEnd) {
                    alert(translations[currentLang]['Please select valid custom start and end dates.']);
                    return;
                }
                actualStartDate = customStart;
                actualEndDate = customEnd;
            }

            if (actualStartDate && actualEndDate) {
                const formattedStartDate = actualStartDate.toISOString().slice(0, 10);
                const formattedEndDate = actualEndDate.toISOString().slice(0, 10);
                stepsApiUrl += `?startDate=${formattedStartDate}&endDate=${formattedEndDate}`;
                exercisesApiUrl += `?startDate=${formattedStartDate}&endDate=${formattedEndDate}`;
            }

            const stepsResponse = await fetch(stepsApiUrl);
            const steps = await stepsResponse.json();
            const exercisesResponse = await fetch(exercisesApiUrl);
            const exercises = await exercisesResponse.json();

            let allFetchedDates = new Set();
            steps.forEach(s => allFetchedDates.add(s.date));
            exercises.forEach(e => allFetchedDates.add(e.date));

            let minDate = null;
            let maxDate = null;

            if (allFetchedDates.size > 0) {
                const sortedUniqueDates = Array.from(allFetchedDates).sort();
                minDate = new Date(sortedUniqueDates[0] + 'T00:00:00Z');
                maxDate = new Date(sortedUniqueDates[sortedUniqueDates.length - 1] + 'T00:00:00Z');
            } else {
                const todayUtc = new Date();
                todayUtc.setUTCHours(0, 0, 0, 0);
                minDate = todayUtc;
                maxDate = todayUtc;
            }

            let displayStartDate = minDate;
            let displayEndDate = maxDate;

            const allDates = [];
            let currentDate = new Date(displayStartDate);
            currentDate.setUTCHours(0, 0, 0, 0);
            let comparisonEndDate = new Date(displayEndDate);
            comparisonEndDate.setUTCHours(0, 0, 0, 0);

            while (currentDate.getTime() <= comparisonEndDate.getTime()) {
                allDates.push(currentDate.toISOString().slice(0, 10));
                currentDate.setUTCDate(currentDate.getUTCDate() + 1);
            }

            let dataPoints = allDates.map(date => {
                const step = steps.find(s => s.date === date);
                const exercise = exercises.find(ex => ex.date === date);
                let backgroundColor = '#f1f1f1'; // No exercise or weights done
                if (exercise) {
                    if (exercise.weights_done === 'Yes' && exercise.done === 'Yes') {
                        backgroundColor = 'darkgreen';
                    } else if (exercise.weights_done === 'Yes') {
                        backgroundColor = '#ADD8E6'; // Only Weights done
                    } else if (exercise.done === 'Yes') {
                        backgroundColor = '#d4edda'; // Only Exercises Done
                    }
                }
                return {
                    date: date,
                    steps: step ? step.quantity : 0,
                    backgroundColor: backgroundColor,
                };
            });

            // Calculate summary stats on unsorted data
            let largestSteps = 0;
            let largestStepsDate = 'N/A';
            const recordedStepsValues = dataPoints.filter(dp => dp.steps > 0).map(dp => dp.steps);
            if (recordedStepsValues.length > 0) {
                largestSteps = Math.max(...recordedStepsValues);
                const largestStepsDataPoint = dataPoints.find(dp => dp.steps === largestSteps);
                if (largestStepsDataPoint) {
                    largestStepsDate = largestStepsDataPoint.date;
                }
            }
            const averageSteps = recordedStepsValues.length > 0 ? Math.round(recordedStepsValues.reduce((a, b) => a + b, 0) / recordedStepsValues.length) : 0;

            document.getElementById('largest-steps').textContent = largestSteps.toLocaleString();
            document.getElementById('largest-steps-date').textContent = largestStepsDate !== 'N/A' ? `(${formatDateDDMMMYY(largestStepsDate)})` : '';
            document.getElementById('average-steps').textContent = averageSteps.toLocaleString();

            // Calculate running average on time-sorted data before applying display sort
            const timeSortedData = [...dataPoints].sort((a, b) => new Date(a.date) - new Date(b.date));
            const runningAverageDataMap = new Map();
            let sum = 0;
            let count = 0;
            timeSortedData.forEach(dp => {
                if (dp.steps > 0) {
                    sum += dp.steps;
                    count++;
                }
                runningAverageDataMap.set(dp.date, count > 0 ? Math.round(sum / count) : 0);
            });

            // Apply sorting for chart display
            switch(sortType) {
                case 'date-asc':
                    dataPoints.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'steps-asc':
                    dataPoints.sort((a, b) => a.steps - b.steps || new Date(a.date) - new Date(b.date));
                    break;
                default: // Default to date-asc if an unknown sortType is encountered
                    dataPoints.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
            }

            const chartLabels = dataPoints.map(dp => dp.date);
            const chartStepsData = dataPoints.map(dp => dp.steps);
            const chartBackgroundColors = dataPoints.map(dp => dp.backgroundColor);
            
            const chartRunningAverageData = chartLabels.map(date => runningAverageDataMap.get(date));

            const borderColors = chartLabels.map(date => date === largestStepsDate ? 'red' : 'transparent');
            const borderWidths = chartLabels.map(date => date === largestStepsDate ? 2 : 0);

            const showRunningAverage = sortType === 'date-asc';

            chartData = {
                labels: chartLabels,
                datasets: [{
                    label: 'Steps per Day',
                    data: chartStepsData,
                    fill: false,
                    borderColor: borderColors,
                    borderWidth: borderWidths,
                    backgroundColor: chartBackgroundColors,
                    tension: 0.1
                },
                {
                    label: 'Running Average',
                    data: showRunningAverage ? chartRunningAverageData : [],
                    type: 'line',
                    fill: false,
                    borderColor: 'blue',
                    borderWidth: 1,
                    tension: 0.1,
                    pointRadius: 0
                }]
            };

            renderChart('bar');
        }

        window.onload = () => {
            setLanguage(currentLang);
            loadChartData();
        };

        async function shareGraph() {
            const shareUrl = window.location.href;
            const shareTitle = "Fred's Steps Progress";
            const shareText = "Check out Fred's daily steps progress in his rehab journey!";

            if (navigator.share) {
                // Use Web Share API if available
                try {
                    await navigator.share({
                        title: shareTitle,
                        text: shareText,
                        url: shareUrl,
                    });
                    console.log('Web Share API used successfully!');
                } catch (error) {
                    console.error('Error sharing using Web Share API:', error);
                    fallbackShare(shareTitle, shareText, shareUrl);
                }
            } else {
                // Fallback for browsers that do not support Web Share API
                    fallbackShare(shareTitle, shareText, shareUrl);
            }
        }

        function fallbackShare(title, text, url) {
            const emailSubject = encodeURIComponent(title);
            const emailBody = encodeURIComponent(`${text}\n\nView the graph here: ${url}`);
            const whatsappText = encodeURIComponent(`${text} ${url}`);

            const shareOptions = `
                Share this graph:
                \n\nEmail: mailto:?subject=${emailSubject}&body=${emailBody}
                \nWhatsApp: https://wa.me/?text=${whatsappText}
                \n\n(Copy the link to share on other platforms: ${url})
            `;
            alert(shareOptions);
        }
    </script>
</body>
</html>
